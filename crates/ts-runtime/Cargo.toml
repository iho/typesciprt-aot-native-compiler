[package]
name = "ts-runtime"
version.workspace = true
edition.workspace = true

# The runtime is compiled as a static library and linked into every generated
# TypeScript binary.  It provides:
#   - console.log (I/O via tokio)
#   - Async task executor (tokio rt-multi-thread)
#   - GC (mark-and-sweep / Boehm) – planned
#   - string interning & concatenation
#   - dynamic dispatch / vtables
#   - basic JS built-ins (Number, String, Array, Object, …)

[lib]
crate-type = ["staticlib", "rlib"]

[features]
dhat-heap = ["dhat"]
napi = []

[dependencies]
dhat = { version = "0.3", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "sync", "time", "net", "process"] }
regex = "1"
url = "2"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
reqwest = { version = "0.12", features = ["rustls-tls"], default-features = false }
sha2    = "0.10"
sha1    = { package = "sha1", version = "0.10" }
md-5    = "0.10"
hmac    = "0.12"
hex     = "0.4"
rand    = "0.8"
uuid    = { version = "1", features = ["v4"] }
pbkdf2  = { version = "0.12", features = ["simple"] }
scrypt  = "0.11"
flate2  = "1"
libc         = "0.2"
corosensei   = "0.2"
tikv-jemallocator = "0.6"
