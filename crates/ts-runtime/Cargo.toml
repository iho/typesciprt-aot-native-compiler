[package]
name = "ts-runtime"
version.workspace = true
edition.workspace = true

# The runtime is compiled as a static library and linked into every generated
# TypeScript binary.  It provides:
#   - console.log (I/O via tokio)
#   - Async task executor (tokio rt-multi-thread)
#   - GC (mark-and-sweep / Boehm) – planned
#   - string interning & concatenation
#   - dynamic dispatch / vtables
#   - basic JS built-ins (Number, String, Array, Object, …)

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "sync", "time", "net"] }
regex = "1"
url = "2"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
