name: Release CLI Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: tscc-linux-x86_64
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: tscc-linux-aarch64
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: tscc-macos-aarch64
          - os: macos-13
            target: x86_64-apple-darwin
            artifact: tscc-macos-x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install LLVM (Linux)
        if: runner.os == 'Linux'
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 18
          echo "MLIR_SYS_180_PREFIX=/usr/lib/llvm-18" >> $GITHUB_ENV
          echo "LLVM_SYS_180_PREFIX=/usr/lib/llvm-18" >> $GITHUB_ENV
          echo "TABLEGEN_180_PREFIX=/usr/lib/llvm-18" >> $GITHUB_ENV

      - name: Install LLVM (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm@18
          LLVM_PREFIX=$(brew --prefix llvm@18)
          echo "MLIR_SYS_180_PREFIX=$LLVM_PREFIX" >> $GITHUB_ENV
          echo "LLVM_SYS_180_PREFIX=$LLVM_PREFIX" >> $GITHUB_ENV
          echo "TABLEGEN_180_PREFIX=$LLVM_PREFIX" >> $GITHUB_ENV

      - name: Build release binary
        run: cargo build --release -p tscc --target ${{ matrix.target }}

      - name: Rename artifact
        run: |
          cp target/${{ matrix.target }}/release/tscc ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: ls -la artifacts/*/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.tag }}
          name: tscc ${{ github.ref_name || inputs.tag }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            ## TypeScript AOT Native Compiler ${{ github.ref_name || inputs.tag }}

            Download the binary for your platform:

            | Platform | Download |
            |----------|---------|
            | Linux x86_64 | `tscc-linux-x86_64` |
            | Linux ARM64 | `tscc-linux-aarch64` |
            | macOS ARM64 (Apple Silicon) | `tscc-macos-aarch64` |
            | macOS x86_64 (Intel) | `tscc-macos-x86_64` |

            ### Usage
            ```bash
            chmod +x tscc-<platform>
            ./tscc-<platform> input.ts          # Compile to native binary
            ./tscc-<platform> input.ts --emit-llvm  # Dump LLVM IR
            ./tscc-<platform> input.ts --emit-mlir  # Dump MLIR
            ```
          files: |
            artifacts/tscc-linux-x86_64/tscc-linux-x86_64
            artifacts/tscc-linux-aarch64/tscc-linux-aarch64
            artifacts/tscc-macos-aarch64/tscc-macos-aarch64
            artifacts/tscc-macos-x86_64/tscc-macos-x86_64
