name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install LLVM (Linux)
        if: runner.os == 'Linux'
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 21
          echo "MLIR_SYS_210_PREFIX=/usr/lib/llvm-21" >> $GITHUB_ENV
          echo "LLVM_SYS_210_PREFIX=/usr/lib/llvm-21" >> $GITHUB_ENV
          echo "TABLEGEN_210_PREFIX=/usr/lib/llvm-21" >> $GITHUB_ENV
          echo "TSCC_LLVM_PREFIX=/usr/lib/llvm-21" >> $GITHUB_ENV

      - name: Install LLVM (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm@21
          LLVM_PREFIX=$(brew --prefix llvm@21)
          echo "MLIR_SYS_210_PREFIX=$LLVM_PREFIX" >> $GITHUB_ENV
          echo "LLVM_SYS_210_PREFIX=$LLVM_PREFIX" >> $GITHUB_ENV
          echo "TABLEGEN_210_PREFIX=$LLVM_PREFIX" >> $GITHUB_ENV
          echo "TSCC_LLVM_PREFIX=$LLVM_PREFIX" >> $GITHUB_ENV

      - name: Build
        run: cargo build -p tscc

      - name: Run tests
        run: cargo test -p tscc -- --include-ignored --test-threads=1
